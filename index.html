<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leungkathy · Infographics 圖表館</title>
<style>
  :root{--ink:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-light:#eef4ff;--primary:#1a73e8;--primary-dark:#1557b0;--font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Helvetica Neue",sans-serif;--shadow-lg:0 4px 12px rgba(0,0,0,0.10);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-family);background:#f6f7f9;color:var(--ink);}
  header{position:sticky;top:0;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:20px 24px 0;z-index:9;
    transition:transform .28s ease;box-shadow:var(--shadow-lg);}
  header.hide{transform:translateY(-110%);}
  .hwrap{max-width:1200px;margin:0 auto;}
  .hdrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo{width:44px;height:44px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:300;color:var(--primary);font-style:italic;position:relative;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);flex:0 0 auto;}
  .logo::after{content:'k';transform:rotate(-6deg);font-family:'Brush Script MT','Segoe Script',cursive,sans-serif;}
  .btext{line-height:1;}
  .btext h1{font-size:22px;font-weight:700;letter-spacing:-0.01em;}
  .btext .sub{font-size:12px;opacity:0.88;margin-top:3px;}
  .corner{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(255,255,255,.14);
    padding:6px 12px;border-radius:999px;white-space:nowrap;}
  @media (max-width:768px){.hdrow{flex-direction:column;text-align:center;}.corner{display:none;}}
  /* 單行橫滑 tab strip：永遠得一row，闊都唔會疊層霸位 */
  nav{display:flex;gap:2px;flex-wrap:nowrap;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav a.tab{font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:10px 10px 0 0;text-decoration:none;white-space:nowrap;flex:0 0 auto;
    color:rgba(255,255,255,.72);border:none;border-bottom:3px solid transparent;background:transparent;cursor:pointer;}
  nav a.tab:hover{color:#fff;background:rgba(255,255,255,.12);}
  nav a.tab.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.16);}
  nav a.open{font-size:13px;font-weight:700;color:#fff;text-decoration:none;margin-left:8px;padding:9px 4px;white-space:nowrap;flex:0 0 auto;}
  main{max-width:1400px;margin:18px auto;padding:0 16px;}
  .framebox{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.08);}
  .framebox iframe{border:none;display:block;background:#fff;}
  .tapopen{display:none;}
  @media (max-width:700px){
    /* 📱 預覽唔夠位睇：成個框變「撳一下開全頁」掣 */
    .tapopen{display:flex;position:absolute;inset:0;z-index:5;align-items:flex-end;justify-content:center;
      background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .tapopen span{pointer-events:none;margin-bottom:14px;background:rgba(26,29,35,.82);color:#fff;
      font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;backdrop-filter:blur(4px);}
  }
  .hint{max-width:1400px;margin:10px auto 30px;padding:0 16px;font-size:12px;color:#9ca3af;}
</style>
</head>
<body>
<header>
  <div class="hwrap">
  <div class="hdrow">
    <div class="brand">
      <div class="logo"></div>
      <div class="btext">
        <h1>leungkathy</h1>
        <div class="sub">All-in-One Financial Dashboard Suite</div>
      </div>
    </div>
    <div class="corner">📐 Infographics 圖表館</div>
  </div>
  <nav id="tabs"></nav>
  </div>
</header>
<main><div class="framebox" id="framebox"><iframe id="frame" title="infographic"></iframe><div class="tapopen" id="tapopen" title="開獨立頁"><span>⤢ 撳一下開全頁・可以匯出 JPEG 貯相簿</span></div></div></main>
<div class="hint" id="hint"></div>
<script>
// ⬇️  出新圖：喺呢個 list 頂部加一行（排第一 = main page 顯示，其餘自動變 tab）
const PAGES = [
  {f:"rm-cl-sell-guide-A4-2026-11.html", t:"Callable Linear 銷售速覽 · 一頁讀懂（如何解釋 · 主推三行 6厘/5厘鎖定/UBS穩信 · 年期選擇 · 適合性燈號＋NGO 判決 · 照讀話術 · 含行方費用口徑）", d:"2026-11-19"},
  {f:"rm-top3-final-A4-2026-11.html", t:"Top 3 終榜 · 賣點×情境×輪動（P1 CL 6厘版／P2 ELN／P3 CL 5.5厘版 · 客賺×費用雙過線 · 轉鷹轉鴿對策 · 輪動地圖含低波四強轉倉 · 含行方費用口徑）", d:"2026-11-19"},
  {f:"rm-fee-top3-A4-2026-11.html", t:"費用三主力 · 現階段最值得買 × 費用最大 Top 3（P1 CL／P2 ELN／P3 5Y 直債 · 分優先順序 × 三情境應對 · 含行方費用口徑）", d:"2026-11-19"},
  {f:"rm-rate-playbook-A4-2026-11.html", t:"息口情境藍圖 · RM 內部 Playbook（現階段賣咩 × 轉鷹／轉鴿／冇事冇幹全應對 · 含行方 fee 口徑）", d:"2026-11-19"},
  {f:"13f-season-q3-2026.html", t:"13F 風向球 Q3 2026（20 大管理人檢閱：AI 輪動・SpaceX・NVDA 對決・避險訊號）", d:"2026-11-17"},
  {f:"week-calendar-2026-11-16-v2.html", t:"本週重點日曆 11-16→20（業績週＋地緣週：NVDA・700/9988・APEC・法案）", d:"2026-11-16"},
  {f:"funds-schroder-duo-1pager-A4-2026-11.html", t:"施羅德雙雄透視 · A4 一頁對比（MAGI×彈性總回報，客用）", d:"2026-11-13"},
  {f:"funds-bond4-1pager-A4-2026-11.html", t:"債券基金部署指南 · A4 橫向一頁對比（五隻含 PIMCO Income II）", d:"2026-11-13"},
  {f:"funds-schroder-duo-2026-11-v2.html", t:"施羅德雙雄透視（MAGI×彈性總回報 · data 欄跟齊低波動四強＋賣點分工）", d:"2026-11-13"},
  {f:"funds-bond4-deploy-2026-11.html", t:"債券基金部署指南（四隻點處理：持有·換馬·時機）", d:"2026-11-13"},
  {f:"funds-lowvol-income-1pager-A4-2026-11.html", t:"低波動四強 · A4 一頁對比（四欄並排，客用）", d:"2026-11-12"},
  {f:"funds-lowvol-income-four-2026-11.html", t:"收息基金低波動四強（富蘭克林×GMADI×東方匯理×PIMCO）", d:"2026-11-12"},
  {f:"sp500-equalweight-rsp-2026-11.html", t:"S&P 500 等權 SPW × RSP ETF 一頁睇（集中度·板塊·年度回報）", d:"2026-11-03"},
  {f:"m7-financing-2026-10-v6.html", t:"M7＋Broadcom 2026 融資排行 · RPO 版（AMZN Q3＋TTM FCF）", d:"2026-10-30"},
  {f:"skhynix-q3-2026-v2.html", t:"SK海力士 Q3 業績一頁睇（超預期·盤後+2.7%）", d:"2026-10-28"},
  {f:"watchlist-2026-10-26-v2.html", t:"下週觀察名單 10-26→30（政策·業績·利率）", d:"2026-10-26"},
  {f:"meta-tsla-q3-2026.html", t:"META × TESLA Q3 業績與指引（客用）", d:"2026-10-22"},
  {f:"funds-income-1pager-A4-2026-10.html", t:"四基金對比 · A4 1-pager（客用）", d:"2026-10-22"},
  {f:"funds-highyield-client-2026-11.html", t:"高息四強 · 客戶精簡版（財息兼收一頁）", d:"2026-11-12"},
  {f:"funds-highyield-compare-2026-11.html", t:"高息收息基金四強對比（財息兼收版：富達×摩根×宏利×東方匯理）", d:"2026-11-12"},
  {f:"funds-income-compare-2026-10.html", t:"多元資產入息基金四強對比（詳細版）", d:"2026-10-22"},
  {f:"spacex-q3-2026.html", t:"SpaceX Q3 2026 業績", d:"2026-10-21"},
];
const tabs=document.getElementById("tabs"), box=document.getElementById("framebox"),
      frame=document.getElementById("frame"), hint=document.getElementById("hint"), links=[];
let cur=0;
document.getElementById("tapopen").onclick=()=>window.open(PAGES[cur].f,"_blank");
function show(i){
  cur=i;
  frame.style.height="150px"; box.style.height="150px"; frame.style.transform="none"; // 切頁先歸零，防上一頁高度閃殘留
  frame.src=PAGES[i].f;
  s.href=PAGES[i].f;
  links.forEach((x,j)=>x.classList.toggle("on",j===i));
  links[i].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); // active tab 喺單行 strip 自動捲到中間
  hint.textContent = `共 ${PAGES.length} 張 · 而家睇緊：${PAGES[i].t}（${PAGES[i].d}）· 撳上方 tab 切換${matchMedia("(max-width:700px)").matches?" · 電話睇靚圖：撳預覽開全頁":""}`;
}
PAGES.forEach((p,i)=>{
  const a=document.createElement("a");
  a.className="tab"; a.href="#"+i;
  a.textContent=p.t+(i===0?"  ★新":"");
  a.onclick=(e)=>{e.preventDefault(); show(i); history.replaceState(null,"","#"+i);};
  tabs.appendChild(a); links.push(a);
});
const s=document.createElement("a");
s.className="open"; s.target="_blank"; s.rel="noopener"; s.href=PAGES[0].f; s.textContent="↗ 開獨立頁";
tabs.appendChild(s);
show(0);

// 自動 scale-to-fit：內容闊過框就縮放，唔會裁走任何欄
function fit(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement) return;
    frame.style.height="0px"; // 先收縮再量：唔係嘅話 scrollHeight 只會反映上一頁殘留高度，永遠縮唔返細
    const w=Math.max(doc.documentElement.scrollWidth, doc.body?doc.body.scrollWidth:0);
    const h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
    if(!w||!h){ frame.style.height="150px"; return; }
    const avail=box.clientWidth;
    const k=Math.min(1, avail/w);
    frame.style.width=w+"px";
    frame.style.height=h+"px";
    frame.style.transform=(k<1)?`scale(${k})`:"none";
    frame.style.transformOrigin="0 0";
    box.style.height=(h*k)+"px";
  }catch(e){}
}
frame.addEventListener("load", ()=>{fit(); setTimeout(fit,300); setTimeout(fit,1200);});
window.addEventListener("resize", fit);

// 📱💻 header 識縮走：向下滾（睇圖）就收埋，向上滾就返嚟；喺頂永遠攤開
const hd=document.querySelector("header");
let lastY=0;
window.addEventListener("scroll", ()=>{
  const y=window.scrollY;
  hd.classList.toggle("hide", y>lastY && y>120);
  lastY=y;
},{passive:true});
</script>
</body>
</html>
