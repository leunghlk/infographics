<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leungkathy · Infographics 圖表館</title>
<style>
  :root{--ink:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-light:#eef4ff;--primary:#1a73e8;--primary-dark:#1557b0;--font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Helvetica Neue",sans-serif;--shadow-lg:0 4px 12px rgba(0,0,0,0.10);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-family);background:#f6f7f9;color:var(--ink);}
  header{position:sticky;top:0;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:20px 24px 14px;z-index:9;
    transition:transform .28s ease;box-shadow:var(--shadow-lg);}
  header.hide{transform:translateY(-110%);}
  .hwrap{max-width:1200px;margin:0 auto;}
  .hdrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo{width:44px;height:44px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:300;color:var(--primary);font-style:italic;position:relative;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);flex:0 0 auto;}
  .logo::after{content:'k';transform:rotate(-6deg);font-family:'Brush Script MT','Segoe Script',cursive,sans-serif;}
  .btext{line-height:1;}
  .btext h1{font-size:22px;font-weight:700;letter-spacing:-0.01em;}
  .btext .sub{font-size:12px;opacity:0.88;margin-top:3px;}
  .corner{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(255,255,255,.14);
    padding:6px 12px;border-radius:999px;white-space:nowrap;}
  @media (max-width:768px){.hdrow{flex-direction:column;text-align:center;}.corner{display:none;}}
  /* folder chips：得 3 粒，唔會掃 */
  .folders{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .folders::-webkit-scrollbar{display:none;}
  .folders a.fl{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;white-space:nowrap;flex:0 0 auto;text-decoration:none;
    color:rgba(255,255,255,.85);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);}
  .folders a.fl:hover{background:rgba(255,255,255,.2);}
  .folders a.fl.on{color:var(--primary);background:#fff;border-color:#fff;}
  main{max-width:1400px;margin:16px auto;padding:0 16px;}
  /* 🔍 搜尋＋開獨立頁 */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .search .sic{font-size:14px;color:var(--muted);flex:0 0 auto;}
  .search input{border:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;background:transparent;color:var(--ink);min-width:0;}
  .search .clear{display:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;flex:0 0 auto;}
  .search.hasq .clear{display:block;}
  .openbtn{font-size:13px;font-weight:700;color:var(--primary);background:var(--accent-light);border:1px solid #c9dcf8;
    border-radius:999px;padding:8px 14px;text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  .openbtn:hover{background:#e0ebfd;}
  /* 🗂 卡片格：分類之下全部頁一眼睇晒，唔使左掃右掃 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-bottom:14px;}
  .card{position:relative;display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:10px 12px 8px;text-decoration:none;color:inherit;cursor:pointer;
    transition:border-color .15s, box-shadow .15s;-webkit-tap-highlight-color:transparent;}
  .card:hover{border-color:#b9cdf0;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card.on{border-color:var(--primary);background:var(--accent-light);box-shadow:0 0 0 1px var(--primary) inset;}
  .card .ct{font-size:12.8px;font-weight:600;line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .cr{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:nowrap;overflow:hidden;}
  .card .cr .gname{background:#f1f3f6;border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap;flex:0 0 auto;}
  .card .new{color:#b45309;background:#fff7e6;border:1px solid #f5d8a8;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;white-space:nowrap;flex:0 0 auto;}
  .card .cr .dt{white-space:nowrap;}
  .noresult{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:22px 0;background:#fff;border:1px dashed var(--line);border-radius:12px;}
  .framebox{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.08);}
  .framebox iframe{border:none;display:block;background:#fff;}
  .tapopen{display:none;}
  @media (max-width:700px){
    /* 📱 卡片兩欄（一格一格掃落嚟，唔使橫掃）；預覽框變「撳一下開全頁」 */
    .cards{grid-template-columns:1fr 1fr;gap:6px;}
    .card{padding:8px 9px 7px;border-radius:10px;}
    .card .ct{font-size:11.8px;-webkit-line-clamp:3;}
    .card .cr{font-size:10px;gap:4px;}
    .toolbar{flex-wrap:wrap;}
    .tapopen{display:flex;position:absolute;inset:0;z-index:5;align-items:flex-end;justify-content:center;
      background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .tapopen span{pointer-events:none;margin-bottom:14px;background:rgba(26,29,35,.82);color:#fff;
      font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;backdrop-filter:blur(4px);}
  }
  .hint{max-width:1400px;margin:10px auto 30px;padding:0 16px;font-size:12px;color:#9ca3af;}
</style>
</head>
<body>
<header>
  <div class="hwrap">
  <div class="hdrow">
    <div class="brand">
      <div class="logo"></div>
      <div class="btext">
        <h1>leungkathy</h1>
        <div class="sub">All-in-One Financial Dashboard Suite</div>
      </div>
    </div>
    <div class="corner">📐 Infographics 圖表館</div>
  </div>
  <div class="folders" id="folders"></div>
  </div>
</header>
<main>
  <div class="toolbar">
    <div class="search" id="searchbox"><span class="sic">🔍</span><input id="q" type="search" placeholder="搜尋：CL、施羅德、13F、SpaceX…" autocomplete="off"><span class="clear" id="qclear" title="清空">✕</span></div>
    <a class="openbtn" id="openA" target="_blank" rel="noopener">↗ 開獨立頁</a>
  </div>
  <div class="cards" id="cards"></div>
  <div class="framebox" id="framebox"><iframe id="frame" title="infographic"></iframe><div class="tapopen" id="tapopen" title="開獨立頁"><span>⤢ 撳一下開全頁・可以匯出 JPEG 貯相簿</span></div></div>
</main>
<div class="hint" id="hint"></div>
<script>
// ⬇️  出新圖：喺呢個 list 頂部加一行（排第一 = ★新，分類之下會自動變卡片）
const PAGES = [
  {g:"rm", f:"rm-cl-sales-card-A4-2026-11.html", t:"Callable Linear 銷售速查卡 · 最少字三步（①點SELL開口一問三線分流→②SELL乜三張主打貨卡含🔒fee＋客收 IRR→③客問怎擋 8 格一句擋法→🚨賣前必講 4 句）· 見客前 30 秒掃一眼", d:"2026-11-23"},
  {g:"rm", f:"rm-cl-sales-kit-A4-2026-11.html", t:"Callable Linear 銷售 Kit · 一頁識賣（唔識 finance 都明：①係乜→②客最驚兩條Q→③憑咩贏三對比→④今日貨源 7 張含🔒fee＋兩行 IRR 對讀→⑤照讀話術 3 條→⑥賣前必講四句）", d:"2026-11-22", r:"7"},
  {g:"rm", f:"rm-cl-sell-guide-A4-2026-11.html", t:"Callable Linear 銷售版 · 一圖兩半（左半 5年鎖定 vs 保險＋現金流圖＋門檻梯距離×頻率×窗數｜右半 2/3年流動性＋被收回蝕定賺表＋客聽法 · 照讀話術 · 🔒行方費用口徑｜＋滾動逐窗年化梯＋27–30 誘因展望）", d:"2026-11-23", r:"8"},
  {g:"rm", f:"rm-cl-termsheet-summary-A4-2026-11.html", t:"Callable Linear Sample Term Sheet 三行對讀（UBS×Barclays×HSBC · 零息直線增長制實證 · 早收年化遞減曲線 · 回購條款逐間列 · desk 問題清單 · RM內部｜＋MREL/TLAC 咩嚟＋27–30 經濟誘因展望 band）", d:"2026-11-23", r:"8"},
  {g:"rm", f:"rm-top3-final-A4-2026-11.html", t:"Top 3 終榜 · 賣點×情境×輪動（P1 CL 6厘版／P2 ELN／P3 CL 5.5厘版 · 客賺×費用雙過線 · 轉鷹轉鴿對策 · 輪動地圖含低波四強轉倉 · 含行方費用口徑）", d:"2026-11-19"},
  {g:"rm", f:"rm-fee-top3-A4-2026-11.html", t:"費用三主力 · 現階段最值得買 × 費用最大 Top 3（P1 CL／P2 ELN／P3 5Y 直債 · 分優先順序 × 三情境應對 · 含行方費用口徑）", d:"2026-11-19"},
  {g:"rm", f:"rm-rate-playbook-A4-2026-11.html", t:"息口情境藍圖 · RM 內部 Playbook（現階段賣咩 × 轉鷹／轉鴿／冇事冇幹全應對 · 含行方 fee 口徑）", d:"2026-11-19"},
  {g:"mkt", f:"13f-season-q3-2026.html", t:"13F 風向球 Q3 2026（20 大管理人檢閱：AI 輪動・SpaceX・NVDA 對決・避險訊號）", d:"2026-11-17"},
  {g:"mkt", f:"week-calendar-2026-11-16-v2.html", t:"本週重點日曆 11-16→20（業績週＋地緣週：NVDA・700/9988・APEC・法案）", d:"2026-11-16"},
  {g:"fund", f:"funds-schroder-duo-1pager-A4-2026-11.html", t:"施羅德雙雄透視 · A4 一頁對比（MAGI×彈性總回報，客用）", d:"2026-11-13"},
  {g:"fund", f:"funds-bond4-1pager-A4-2026-11.html", t:"債券基金部署指南 · A4 橫向一頁對比（五隻含 PIMCO Income II）", d:"2026-11-13"},
  {g:"fund", f:"funds-schroder-duo-2026-11-v2.html", t:"施羅德雙雄透視（MAGI×彈性總回報 · data 欄跟齊低波動四強＋賣點分工）", d:"2026-11-13"},
  {g:"fund", f:"funds-bond4-deploy-2026-11.html", t:"債券基金部署指南（四隻點處理：持有·換馬·時機）", d:"2026-11-13"},
  {g:"fund", f:"funds-lowvol-income-1pager-A4-2026-11.html", t:"低波動四強 · A4 一頁對比（四欄並排，客用）", d:"2026-11-12"},
  {g:"fund", f:"funds-lowvol-income-four-2026-11.html", t:"收息基金低波動四強（富蘭克林×GMADI×東方匯理×PIMCO）", d:"2026-11-12"},
  {g:"mkt", f:"sp500-equalweight-rsp-2026-11.html", t:"S&P 500 等權 SPW × RSP ETF 一頁睇（集中度·板塊·年度回報）", d:"2026-11-03"},
  {g:"mkt", f:"m7-financing-2026-10-v6.html", t:"M7＋Broadcom 2026 融資排行 · RPO 版（AMZN Q3＋TTM FCF）", d:"2026-10-30"},
  {g:"mkt", f:"skhynix-q3-2026-v2.html", t:"SK海力士 Q3 業績一頁睇（超預期·盤後+2.7%）", d:"2026-10-28"},
  {g:"mkt", f:"watchlist-2026-10-26-v2.html", t:"下週觀察名單 10-26→30（政策·業績·利率）", d:"2026-10-26"},
  {g:"mkt", f:"meta-tsla-q3-2026.html", t:"META × TESLA Q3 業績與指引（客用）", d:"2026-10-22"},
  {g:"fund", f:"funds-income-1pager-A4-2026-10.html", t:"四基金對比 · A4 1-pager（客用）", d:"2026-10-22"},
  {g:"fund", f:"funds-highyield-client-2026-11.html", t:"高息四強 · 客戶精簡版（財息兼收一頁）", d:"2026-11-12"},
  {g:"fund", f:"funds-highyield-compare-2026-11.html", t:"高息收息基金四強對比（財息兼收版：富達×摩根×宏利×東方匯理）", d:"2026-11-12"},
  {g:"fund", f:"funds-income-compare-2026-10.html", t:"多元資產入息基金四強對比（詳細版）", d:"2026-10-22"},
  {g:"mkt", f:"spacex-q3-2026.html", t:"SpaceX Q3 2026 業績", d:"2026-10-21"},
];
const GROUPS=[
  {k:"rm",n:"💼 RM 銷售·息口"},
  {k:"fund",n:"🏦 基金對比"},
  {k:"mkt",n:"📊 市場·公司"},
];
const cards=document.getElementById("cards"), folders=document.getElementById("folders"),
      box=document.getElementById("framebox"), frame=document.getElementById("frame"),
      hint=document.getElementById("hint"), q=document.getElementById("q"),
      searchbox=document.getElementById("searchbox"), qclear=document.getElementById("qclear"),
      openA=document.getElementById("openA"), flinks=[];
let cur=0, curG=null;

function renderCards(){
  const query=q.value.trim().toLowerCase();
  searchbox.classList.toggle("hasq", query.length>0);
  const list=[];
  PAGES.forEach((p,i)=>{
    if(query){
      if((p.t+" "+p.d+" "+p.f+" "+((GROUPS.find(x=>x.k===p.g)||{}).n||"")).toLowerCase().includes(query)) list.push({p,i});
    }else if(p.g===curG) list.push({p,i});
  });
  cards.innerHTML="";
  if(!list.length){
    const d=document.createElement("div"); d.className="noresult";
    d.textContent="搵唔到——試另一個關鍵字（例如 CL、基金、13F）";
    cards.appendChild(d); return;
  }
  list.forEach(({p,i})=>{
    const a=document.createElement("a");
    a.className="card"+(i===cur?" on":"");
    a.href="#"+i; a.setAttribute("data-i", String(i));
    const ct=document.createElement("div"); ct.className="ct"; ct.textContent=p.t; a.appendChild(ct);
    const cr=document.createElement("div"); cr.className="cr";
    if(query){
      const g=document.createElement("span"); g.className="gname";
      g.textContent=(GROUPS.find(x=>x.k===p.g)||{}).n||p.g; cr.appendChild(g);
    }
    const dt=document.createElement("span"); dt.className="dt"; dt.textContent=p.d; cr.appendChild(dt);
    if(i===0){ const n=document.createElement("span"); n.className="new"; n.textContent="★新"; cr.appendChild(n); }
    a.appendChild(cr);
    a.onclick=(e)=>{
      e.preventDefault();
      if(p.g!==curG){ curG=p.g; flinks.forEach((x,j)=>x.classList.toggle("on",GROUPS[j].k===curG)); try{sessionStorage.setItem("tsG",curG);}catch(err){} }
      show(i, true); history.replaceState(null,"","#"+i);
    };
    cards.appendChild(a);
  });
}
// 🔁 cache-buster：跟返張卡嘅 d 日期——改板必同步 d（規矩），日期一變 iframe/獨立頁自動食新版，唔再食 10 分鐘舊 cache
function pageURL(i){ var p=PAGES[i]; return p.f+"?v="+String(p.d).replace(/-/g,"")+(p.r||""); }
document.getElementById("tapopen").onclick=()=>window.open(pageURL(cur),"_blank");
function show(i, scroll){
  cur=i;
  frame.style.height="150px"; box.style.height="150px"; frame.style.transform="none"; // 切頁先歸零，防上一頁高度閃殘留
  frame.src=pageURL(i);
  openA.href=pageURL(i);
  cards.querySelectorAll(".card").forEach(x=>x.classList.toggle("on", x.getAttribute("data-i")===String(i)));
  hint.textContent = `共 ${PAGES.length} 張 · 而家睇緊：${PAGES[i].t}（${PAGES[i].d}）· 撳卡片揀頁，或用搜尋搵關鍵字${matchMedia("(max-width:700px)").matches?" · 電話睇靚圖：撳預覽開全頁":""}`;
  if(scroll && matchMedia("(max-width:700px)").matches) box.scrollIntoView({behavior:"smooth",block:"start"});
}
function setG(k, i){
  curG=k;
  flinks.forEach((x,j)=>x.classList.toggle("on",GROUPS[j].k===k));
  renderCards();
  if(i!=null) show(i);
}
GROUPS.forEach((g,j)=>{
  const a=document.createElement("a");
  a.className="fl"; a.href="#"+g.k;
  a.textContent=g.n;
  a.onclick=(e)=>{
    e.preventDefault();
    if(q.value){ q.value=""; } // 揀分類＝想睇嗰組全部，清走搜尋
    setG(g.k, PAGES.findIndex(p=>p.g===g.k)); history.replaceState(null,"","#"+g.k);
  };
  folders.appendChild(a); flinks.push(a);
});
q.addEventListener("input", renderCards);
qclear.addEventListener("click", ()=>{ q.value=""; renderCards(); });
// 入場：#12 直接開第 12 張；?q= 關鍵字直接搜；否則記住上次揀過嘅 folder（session 內）
const startHash=location.hash;
const qs=new URLSearchParams(location.search).get("q");
if(qs!=null && qs.length){ q.value=qs; }
const lastG=(()=>{try{return sessionStorage.getItem("tsG")}catch(e){return null}})();
const startG=(lastG && GROUPS.some(g=>g.k===lastG))?lastG:GROUPS[0].k;
if(startHash && startHash.length>1 && !isNaN(+startHash.slice(1))){
  const i=Math.max(0,Math.min(PAGES.length-1,+startHash.slice(1)));
  setG(PAGES[i].g, i);
}else{
  setG(startG, PAGES.findIndex(p=>p.g===startG));
}
setInterval(()=>{ try{ if(curG) sessionStorage.setItem("tsG",curG); }catch(e){} },1500);

// 自動 scale-to-fit：內容闊過框就縮放，唔會裁走任何欄
function fit(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement) return;
    frame.style.height="0px"; // 先收縮再量：唔係嘅話 scrollHeight 只會反映上一頁殘留高度，永遠縮唔返細
    const w=Math.max(doc.documentElement.scrollWidth, doc.body?doc.body.scrollWidth:0);
    const h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
    if(!w||!h){ frame.style.height="150px"; return; }
    const avail=box.clientWidth;
    const k=Math.min(1, avail/w);
    frame.style.width=w+"px";
    frame.style.height=h+"px";
    frame.style.transform=(k<1)?`scale(${k})`:"none";
    frame.style.transformOrigin="0 0";
    box.style.height=(h*k)+"px";
  }catch(e){}
}
frame.addEventListener("load", ()=>{fit(); setTimeout(fit,300); setTimeout(fit,1200);});
window.addEventListener("resize", fit);

// 📱💻 header 識縮走：向下滾（睇圖）就收埋，向上滾就返嚟；喺頂永遠攤開
const hd=document.querySelector("header");
let lastY=0;
window.addEventListener("scroll", ()=>{
  const y=window.scrollY;
  hd.classList.toggle("hide", y>lastY && y>120);
  lastY=y;
},{passive:true});
</script>
</body>
</html>
