<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infographics</title>
<style>
  :root{--ink:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-light:#eef4ff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f6f7f9;color:var(--ink);}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 0;z-index:9;}
  header h1{font-size:17px;font-weight:800;margin-bottom:8px;}
  nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  nav a.tab{font-size:14px;font-weight:600;padding:9px 18px;border-radius:10px 10px 0 0;text-decoration:none;
    color:var(--muted);border:none;border-bottom:3px solid transparent;background:transparent;cursor:pointer;}
  nav a.tab:hover{color:var(--ink);background:#f3f4f6;}
  nav a.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-light);}
  nav a.open{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;margin-left:10px;padding:9px 4px;}
  main{max-width:1400px;margin:18px auto;padding:0 16px;}
  .framebox{width:100%;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.08);}
  .framebox iframe{border:none;display:block;background:#fff;}
  .hint{max-width:1400px;margin:10px auto 30px;padding:0 16px;font-size:12px;color:#9ca3af;}
</style>
</head>
<body>
<header>
  <h1>📐 Infographics</h1>
  <nav id="tabs"></nav>
</header>
<main><div class="framebox" id="framebox"><iframe id="frame" title="infographic"></iframe></div></main>
<div class="hint" id="hint"></div>
<script>
// ⬇️  出新圖：喺呢個 list 頂部加一行（排第一 = main page 顯示，其餘自動變 tab）
const PAGES = [
  {f:"m7-financing-2026-10-v5.html", t:"M7＋Broadcom 2026 融資排行 · RPO 版（AMZN Q3 已更新）", d:"2026-10-30"},
  {f:"skhynix-q3-2026-v2.html", t:"SK海力士 Q3 業績一頁睇（超預期·盤後+2.7%）", d:"2026-10-28"},
  {f:"watchlist-2026-10-26-v2.html", t:"下週觀察名單 10-26→30（政策·業績·利率）", d:"2026-10-26"},
  {f:"meta-tsla-q3-2026.html", t:"META × TESLA Q3 業績與指引（客用）", d:"2026-10-22"},
  {f:"funds-income-1pager-A4-2026-10.html", t:"四基金對比 · A4 1-pager（客用）", d:"2026-10-22"},
  {f:"funds-income-compare-2026-10.html", t:"多元資產入息基金四強對比（詳細版）", d:"2026-10-22"},
  {f:"spacex-q3-2026.html", t:"SpaceX Q3 2026 業績", d:"2026-10-21"},
];
const tabs=document.getElementById("tabs"), box=document.getElementById("framebox"),
      frame=document.getElementById("frame"), hint=document.getElementById("hint"), links=[];
function show(i){
  frame.style.height="150px"; box.style.height="150px"; frame.style.transform="none"; // 切頁先歸零，防上一頁高度閃殘留
  frame.src=PAGES[i].f;
  s.href=PAGES[i].f;
  links.forEach((x,j)=>x.classList.toggle("on",j===i));
  hint.textContent = `共 ${PAGES.length} 張 · 而家睇緊：${PAGES[i].t}（${PAGES[i].d}）· 撳上方 tab 切換`;
}
PAGES.forEach((p,i)=>{
  const a=document.createElement("a");
  a.className="tab"; a.href="#"+i;
  a.textContent=p.t+(i===0?"  ★新":"");
  a.onclick=(e)=>{e.preventDefault(); show(i); history.replaceState(null,"","#"+i);};
  tabs.appendChild(a); links.push(a);
});
const s=document.createElement("a");
s.className="open"; s.target="_blank"; s.rel="noopener"; s.href=PAGES[0].f; s.textContent="↗ 開獨立頁";
tabs.appendChild(s);
show(0);

// 自動 scale-to-fit：內容闊過框就縮放，唔會裁走任何欄
function fit(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement) return;
    frame.style.height="0px"; // 先收縮再量：唔係嘅話 scrollHeight 只會反映上一頁殘留高度，永遠縮唔返細
    const w=Math.max(doc.documentElement.scrollWidth, doc.body?doc.body.scrollWidth:0);
    const h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
    if(!w||!h){ frame.style.height="150px"; return; }
    const avail=box.clientWidth;
    const k=Math.min(1, avail/w);
    frame.style.width=w+"px";
    frame.style.height=h+"px";
    frame.style.transform=(k<1)?`scale(${k})`:"none";
    frame.style.transformOrigin="0 0";
    box.style.height=(h*k)+"px";
  }catch(e){}
}
frame.addEventListener("load", ()=>{fit(); setTimeout(fit,300); setTimeout(fit,1200);});
window.addEventListener("resize", fit);
</script>
</body>
</html>
